[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jpdm"
version = "1.0.0"
description = "Joint-production displacement model: how much animal production falls when one product of an animal is replaced"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code); CC BY 4.0 (data, results, paper, figures)" }
dependencies = ["numpy>=1.22", "openpyxl>=3.0", "matplotlib>=3.5",
                'tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
